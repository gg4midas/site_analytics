# ============================================================
# 网站流量统计 · 反向代理放行片段（通用 Nginx）
# 作用：把「埋点脚本」与「事件上报接口」公开，其余面板路径可保持 basic auth 等访问控制。
# 用法：把下面的两段 location 整段复制，粘贴到你的 Nginx 站点配置
#   server { ... }  内部（宝塔 / aaPanel / 1Panel / cPanel 等面板，
#   进入站点「设置 / 配置文件」粘进 server 块即可；纯 Nginx 则放进对应 conf）。
#   保存并重载 nginx 后生效（宝塔等面板点保存即自动重载）。
# 注意：后端监听端口若为其它（如 8900），改下面的 8899 即可。
#
# ── 关于 X-Forwarded-For（重要，v1.8.4 起）─────────────────────────────────
# 这里必须用 $remote_addr **覆盖**，不要用 $proxy_add_x_forwarded_for（追加）。
# 后者会把「客户端自己塞进来的伪造值」放到最前面，而后端只采信**最右一跳**
# （反代自己追加的那一段 = 真实客户端 IP）——两端配合才不会被伪造。
# 若你的站点前面还有 CDN，请在 server 块里用 nginx real_ip 模块把 $remote_addr
# 还原成真实客户端 IP，再由本片段透传：
#     set_real_ip_from  <CDN 的 IP 段>;
#     real_ip_header    X-Forwarded-For;
# 后端默认只信任「同机 loopback」的反代（应用只监听 127.0.0.1）；
# 反代在别的机器上时，请给后端进程设置环境变量 SA_TRUSTED_PROXIES=<反代IP或CIDR>。
# ============================================================

# 1) 埋点脚本：所有访客浏览器要加载，必须公开
location = /tracker.js {
    auth_basic off;
    proxy_pass http://127.0.0.1:8899;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2) 事件上报接口：POST/GET 都要公开，否则事件进不了库
location /api/event {
    auth_basic off;
    proxy_pass http://127.0.0.1:8899;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 上报用 sendBeacon / fetch，可能带 JSON body，放宽大小限制
    client_max_body_size 256k;
}
